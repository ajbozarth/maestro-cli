apiVersion: maestro/v1alpha1
kind: MCPTool
metadata:
  name: k8s
  namespace:  default
spec:
  image: ghcr.io/stackloklabs/mkp/server:latest
  transport: sse
  port: 30051
  permissionProfile:
    type: builtin
    name: network
  resources:
    limits:
      cpu: '100m'
      memory: '128Mi'
    requests:
      cpu: '50m'
      memory: '64Mi'


